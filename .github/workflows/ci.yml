name: CI - Docker y GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

# El GITHUB_TOKEN solo necesita leer el código y escribir paquetes en GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build-verify-publish:
    name: Construir, verificar y publicar
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Calcular nombre de imagen y tag
        id: meta
        run: |
          # GHCR exige el nombre en minúsculas; el tag es el SHA corto (7 caracteres).
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Imagen a publicar: ${IMAGE}:${TAG}"

      - name: Construir imagen Docker
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            .

      - name: Verificar la aplicación
        run: |
          docker run -d --name app -p 8080:80 "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

          # Esperar a que nginx responda (hasta 15 segundos).
          for i in $(seq 1 15); do
            curl -fs http://localhost:8080 > /dev/null && break
            sleep 1
          done

          if curl -fs http://localhost:8080 | grep -q "Hola DevOps"; then
            echo "Verificación correcta: la página contiene 'Hola DevOps'."
          else
            echo "Error: la página no contiene 'Hola DevOps'."
            docker logs app
            exit 1
          fi

      - name: Detener contenedor de prueba
        if: always()
        run: docker rm -f app || true

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "docker run --rm -p 8081:80 ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
